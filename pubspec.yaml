name: gavthan_bar_restro
description: Offline-first table, customer order, billing, revenue and stock app for Gavthan Bar and Restro.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.4
  file_picker: ^8.1.7
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4+4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/gavthan_logo.jpeg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/gavthan_logo.jpeg
  remove_alpha_ios: true
